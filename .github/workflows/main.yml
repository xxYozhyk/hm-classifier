# .github/workflows/main.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/hm-classifier

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx
      
      - name: Download test model files (if not in repo)
        run: |
          # Проверяем наличие модели, если нет - создаем заглушку для тестов
          if [ ! -f "lstm_model.pth" ]; then
            echo "⚠️ Model file not found, tests may fail"
          fi
      
      - name: Run tests
        run: |
          python -m pytest test_main.py -v --cov=. --cov-report=term-missing --cov-report=xml --junitxml=pytest.xml
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            pytest.xml
            coverage.xml

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy locally (for testing)
        run: |
          echo "🚀 Starting deployment..."
          
          # Pull latest image
          docker pull ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/hm-classifier:latest
          
          # Stop and remove old container
          docker stop hm-classifier 2>/dev/null || true
          docker rm hm-classifier 2>/dev/null || true
          
          # Run new container
          docker run -d \
            --name hm-classifier \
            --restart always \
            -p 8000:8000 \
            ${{ env.REGISTRY }}/${{ secrets.DOCKER_USERNAME }}/hm-classifier:latest
          
          # Wait for service to start
          sleep 10
          
          # Check health
          curl -f http://localhost:8000/health || exit 1
          
          echo "✅ Deployment successful!"
          echo "🌐 Service running on port 8000"
      
      - name: Test prediction endpoint
        run: |
          echo "Testing prediction endpoint..."
          curl -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"name": "cotton t-shirt", "description": "soft cotton t-shirt with short sleeves"}' \
            | jq .
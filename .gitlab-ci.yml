# .gitlab-ci.yml
stages:
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""

# Кэширование зависимостей для ускорения
cache:
  paths:
    - .venv/
    - .cache/pip/

# Этап 1: Тестирование
test:
  stage: test
  image: python:3.9-slim
  before_script:
    - apt-get update && apt-get install -y gcc g++
    - pip install --no-cache-dir -r requirements.txt
    - pip install pytest pytest-cov
  script:
    - python -m pytest tests/test_app.py -v --cov=app --cov-report=term-missing
  artifacts:
    when: always
    reports:
      junit: pytest.xml
    paths:
      - pytest.xml
  only:
    - main
    - merge_requests

# Этап 2: Сборка Docker образа
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image with tag: $DOCKER_IMAGE"
    - docker build -t $DOCKER_IMAGE -t $CI_REGISTRY_IMAGE:latest .
    - docker push $DOCKER_IMAGE
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main
  needs:
    - test

# Этап 3: Деплой (ручной)
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client ansible
    - chmod 600 $SSH_PRIVATE_KEY
    - eval $(ssh-agent -s)
    - ssh-add $SSH_PRIVATE_KEY
  script:
    - echo "Deploying to production server..."
    - cd ansible
    - ansible-playbook -i inventory.yml deploy.yml -v
  only:
    - main
  when: manual
  needs:
    - build
  environment:
    name: production
    url: http://your-server-ip:8000
  variables:
    GIT_STRATEGY: clone